name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

env:
  FRONTEND_IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/frontend
  BACKEND_IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # - name: Set up Docker login to ACR
      #   run: |
      #     az acr login --name ${{ secrets.ACR_NAME }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and Push Frontend Image
        run: |
          docker build -t praveena31/frontend:latest ./frontend
          docker push praveena31/frontend:latest

      - name: Build and Push Backend Image
        run: |
          docker build -t praveena31/backend:latest ./backend
          docker push praveena31/backend:latest

      - name: Get AKS Credentials
        run: |
          az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Update Kubernetes manifests
        run: |
          sed -i "s|praveena31/frontend:latest|praveena31:latest|g" ./frontend/deployment.yaml
          sed -i "s|praveena31/backend:latest|praveena31:latest|g" ./backend/deployment.yaml


      - name: Install NGINX Ingress Controller
        run: |
            kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml

      - name: Wait for NGINX Ingress Controller external IP
        run: |
           echo "Waiting for NGINX Ingress Controller external IP..."
           for i in {1..30}; do
           IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
           if [ -n "$IP" ]; then
            echo "Ingress External IP: $IP"
            break
           fi
            echo "Still waiting... ($i/30)"
           sleep 10
           done



      - name: Deploy to AKS
        run: |
          kubectl apply -f database/
          kubectl apply -f backend/deployment.yaml
          kubectl apply -f backend/service.yaml
          kubectl apply -f frontend/deployment.yaml
          kubectl apply -f frontend/service.yaml
          kubectl apply -f ingress.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods -o wide
          kubectl get svc
